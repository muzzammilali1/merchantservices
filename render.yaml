databases:
  - name: merchant-payments-db
    plan: starter
    databaseName: merchant_payments
    user: postgres

services:
  - type: web
    name: merchant-payments-server
    runtime: docker
    plan: starter
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: merchant-payments-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://merchant-payments-portal.onrender.com,https://merchant-payments-admin.onrender.com

  - type: web
    name: merchant-payments-portal
    runtime: static
    rootDir: portal
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://merchant-payments-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: merchant-payments-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://merchant-payments-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
