services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: merchant_payments
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/merchant_payments
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  portal:
    build:
      context: ./portal
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    ports:
      - "5173:80"
    depends_on:
      - server

  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    ports:
      - "5174:80"
    depends_on:
      - server

volumes:
  postgres_data:
